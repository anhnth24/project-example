openapi: 3.1.0
info:
  title: Markhand Web API
  version: 0.1.0
  description: Phase 1B POC API contract for auth, ingest, retrieval, Q&A, and jobs.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /health/live:
    get:
      operationId: healthLive
      security: []
      responses:
        "200":
          description: Process health; does not contact dependencies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /health/ready:
    get:
      operationId: healthReady
      security: []
      responses:
        "200":
          description: Fail-closed dependency readiness (DB/vector/object/embedding/signature/reconcile).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/ApiError"
  /health/start:
    get:
      operationId: healthStart
      security: []
      responses:
        "200":
          description: Startup latch completed (migrations/runtime boot finished).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/ApiError"
  /auth/login:
    post:
      operationId: authLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Access + refresh token pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/refresh:
    post:
      operationId: authRefresh
      security: []
      requestBody:
        required: true
        description: The refresh token travels in the JSON body, not a cookie.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Rotated token pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/logout:
    post:
      operationId: authLogout
      security: []
      requestBody:
        required: true
        description: The refresh token travels in the JSON body, not a cookie.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "204":
          description: Session revoked.
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/me:
    get:
      operationId: authMe
      responses:
        "200":
          description: Current OrgContext snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /uploads:
    post:
      operationId: createUpload
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, collectionId]
              properties:
                file:
                  type: string
                  format: binary
                collectionId:
                  type: string
                  format: uuid
                documentId:
                  type: string
                  format: uuid
                  description: >
                    Existing document in collectionId. When supplied, the upload
                    creates the next immutable version instead of a new document.
                    The current document must be fully indexed.
      responses:
        "201":
          description: >
            Upload stored; document+version registered. Accepted disposition also
            enqueues convert. Quarantined disposition awaits approve-intake
            (doc.quarantine.review). Idempotent same-envelope replay returns the
            same stable body (requestId may differ).
          content:
            application/json:
              schema:
                type: object
                required:
                  [disposition, objectId, sha256, sizeBytes, canonicalFormat, requestId]
                properties:
                  disposition: { type: string }
                  objectId: { type: string, format: uuid }
                  documentId: { type: string, format: uuid }
                  versionId: { type: string, format: uuid }
                  jobId: { type: string, format: uuid }
                  collectionId: { type: string, format: uuid }
                  sha256: { type: string }
                  sizeBytes: { type: integer }
                  canonicalFormat: { type: string }
                  requestId: { type: string }
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          description: Idempotency conflict or document not ready for a new revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /collections:
    get:
      operationId: listCollections
      responses:
        "200":
          description: Collections visible to the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionPage"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      operationId: createCollection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCollectionRequest"
      responses:
        "201":
          description: Collection created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "403":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /collections/{collectionId}:
    parameters:
      - $ref: "#/components/parameters/collectionId"
    get:
      operationId: getCollection
      responses:
        "200":
          description: Collection detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "404":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
    patch:
      operationId: updateCollection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCollectionRequest"
      responses:
        "200":
          description: Collection metadata updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "404":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: deleteCollection
      responses:
        "204":
          description: Collection soft-deleted.
        "404":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /collections/{collectionId}/documents:
    get:
      operationId: listDocuments
      parameters:
        - $ref: "#/components/parameters/collectionId"
        - name: limit
          in: query
          description: Page size (server default 50, clamped to [1, 100]).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          description: Opaque pagination cursor from a previous page's nextCursor.
          schema:
            type: string
      responses:
        "200":
          description: Paginated documents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentPage"
        "404":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /collections/{collectionId}/documents/{documentId}/approve-intake:
    post:
      operationId: approveIntake
      summary: Approve a quarantined upload (requires doc.quarantine.review)
      parameters:
        - $ref: "#/components/parameters/collectionId"
        - $ref: "#/components/parameters/documentId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        "200":
          description: Convert job created or idempotent replay of existing job.
          content:
            application/json:
              schema:
                type: object
                required: [documentId, versionId, collectionId, jobId, created, requestId]
                properties:
                  documentId: { type: string, format: uuid }
                  versionId: { type: string, format: uuid }
                  collectionId: { type: string, format: uuid }
                  jobId: { type: string, format: uuid }
                  created: { type: boolean }
                  requestId: { type: string }
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /documents/{documentId}:
    get:
      operationId: getDocument
      parameters:
        - $ref: "#/components/parameters/documentId"
      responses:
        "200":
          description: Document detail (published-visible).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "404":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: deleteDocument
      parameters:
        - $ref: "#/components/parameters/documentId"
      responses:
        "204":
          description: Tombstone delete requested.
        "404":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /documents/{documentId}/preview:
    get:
      operationId: previewDocument
      parameters:
        - $ref: "#/components/parameters/documentId"
        - name: versionId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: >
            Trusted Markdown preview (published-only; history for non-current).
            Still JSON: the Markdown text is embedded as the `markdown` string
            field, not returned as a text/markdown body.
          content:
            application/json:
              schema:
                type: object
                required:
                  - documentId
                  - versionId
                  - versionNumber
                  - sourceContentSha256
                  - canonicalMarkdownSha256
                  - isCurrent
                  - truncated
                  - markdown
                  - requestId
                properties:
                  documentId: { type: string, format: uuid }
                  versionId: { type: string, format: uuid }
                  versionNumber: { type: integer }
                  sourceContentSha256: { type: string }
                  canonicalMarkdownSha256: { type: string }
                  isCurrent: { type: boolean }
                  truncated: { type: boolean }
                  markdown: { type: string }
                  requestId: { type: string }
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /documents/{documentId}/versions:
    get:
      operationId: listDocumentVersions
      parameters:
        - $ref: "#/components/parameters/documentId"
      responses:
        "200":
          description: Published versions (non-current requires qa.history).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentVersionPage"
        "429":
          $ref: "#/components/responses/RateLimited"
  /documents/{documentId}/versions/{versionId}:
    get:
      operationId: getDocumentVersion
      parameters:
        - $ref: "#/components/parameters/documentId"
        - $ref: "#/components/parameters/versionId"
      responses:
        "200":
          description: Published version detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentVersion"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /documents/{documentId}/versions/{versionId}/diff:
    get:
      operationId: diffDocumentVersions
      parameters:
        - $ref: "#/components/parameters/documentId"
        - $ref: "#/components/parameters/versionId"
        - name: against
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: >
            Version identity diff (compare retrieval for content deltas).
            Not a text diff: left/right are the two full version records.
          content:
            application/json:
              schema:
                type: object
                required: [documentId, left, right, note, requestId]
                properties:
                  documentId: { type: string, format: uuid }
                  left:
                    $ref: "#/components/schemas/DocumentVersion"
                  right:
                    $ref: "#/components/schemas/DocumentVersion"
                  note: { type: string }
                  requestId: { type: string }
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /documents/{documentId}/versions/{versionId}/publish:
    post:
      operationId: publishDocumentVersion
      parameters:
        - $ref: "#/components/parameters/documentId"
        - $ref: "#/components/parameters/versionId"
      responses:
        "204":
          description: Version published / current pointer updated.
        "429":
          $ref: "#/components/responses/RateLimited"
  /documents/{documentId}/versions/{versionId}/download-capability:
    post:
      operationId: issueDownloadCapability
      parameters:
        - $ref: "#/components/parameters/documentId"
        - $ref: "#/components/parameters/versionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose]
              properties:
                purpose:
                  type: string
                  enum: [markdown, original]
      responses:
        "200":
          description: Short-lived single-use download capability.
          content:
            application/json:
              schema:
                type: object
                required:
                  [capability, expiresIn, purpose, documentId, versionId, requestId]
                properties:
                  capability:
                    type: string
                    description: Opaque single-use token; redeem via GET /downloads/{capability}.
                  expiresIn: { type: integer }
                  purpose:
                    type: string
                    enum: [markdown, original]
                  documentId: { type: string, format: uuid }
                  versionId: { type: string, format: uuid }
                  requestId: { type: string }
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /downloads/{capability}:
    get:
      operationId: redeemDownload
      parameters:
        - name: capability
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: >
            Object bytes streamed after fresh ACL + single-use redeem.
            Media type depends on the capability's purpose: `text/markdown;
            charset=utf-8` for the trusted canonical Markdown, or
            `application/octet-stream` for the original uploaded bytes.
            `Content-Disposition: attachment` is always set.
          content:
            text/markdown:
              schema:
                type: string
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /documents/{documentId}/reindex:
    post:
      operationId: reindexDocument
      parameters:
        - $ref: "#/components/parameters/documentId"
      responses:
        "200":
          description: Idempotent index job enqueue.
          content:
            application/json:
              schema:
                type: object
                required: [jobId, created, documentId, versionId, requestId]
                properties:
                  jobId: { type: string, format: uuid }
                  created:
                    type: boolean
                    description: False when an existing idempotent job was replayed.
                  documentId: { type: string, format: uuid }
                  versionId: { type: string, format: uuid }
                  requestId: { type: string }
        "429":
          $ref: "#/components/responses/RateLimited"
  /citations/resolve:
    post:
      operationId: resolveCitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveCitationRequest"
      responses:
        "200":
          description: Freshly authorized citation pin with exact UTF-8 span.
          content:
            application/json:
              schema:
                type: object
                required: [citation, requestId]
                properties:
                  citation:
                    type: object
                    required:
                      - citeId
                      - logicalDocumentId
                      - versionId
                      - versionNumber
                      - sourceContentSha256
                      - canonicalMarkdownSha256
                      - quoteSha256
                      - chunkId
                      - chunkIdentitySha256
                      - page
                      - slide
                      - sheet
                      - sourceSpanStart
                      - sourceSpanEnd
                      - quoteLocalStart
                      - quoteLocalEnd
                      - quote
                      - isCurrent
                      - anchor
                    properties:
                      citeId: { type: string }
                      logicalDocumentId: { type: string, format: uuid }
                      versionId: { type: string, format: uuid }
                      versionNumber: { type: integer }
                      sourceContentSha256: { type: string }
                      canonicalMarkdownSha256: { type: string }
                      quoteSha256: { type: string }
                      chunkId: { type: string, format: uuid }
                      chunkIdentitySha256: { type: string }
                      page: { type: [integer, "null"] }
                      slide: { type: [integer, "null"] }
                      sheet: { type: [string, "null"] }
                      sourceSpanStart: { type: integer }
                      sourceSpanEnd: { type: integer }
                      quoteLocalStart: { type: integer }
                      quoteLocalEnd: { type: integer }
                      quote: { type: string }
                      isCurrent: { type: boolean }
                      anchor: { type: string }
                  requestId: { type: string }
        "400":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /conflicts:
    get:
      operationId: listConflicts
      responses:
        "200":
          description: Open conflicts where both claim collections are authorized.
          content:
            application/json:
              schema:
                type: object
                required: [items, requestId]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - status
                        - severity
                        - conflictType
                        - claimAId
                        - claimBId
                        - collectionAId
                        - collectionBId
                        - firstDetectedAt
                        - resolvedAt
                      properties:
                        id: { type: string, format: uuid }
                        status: { type: string }
                        severity: { type: string }
                        conflictType: { type: string }
                        claimAId: { type: string, format: uuid }
                        claimBId: { type: string, format: uuid }
                        collectionAId: { type: string, format: uuid }
                        collectionBId: { type: string, format: uuid }
                        firstDetectedAt: { type: string, format: date-time }
                        resolvedAt: { type: [string, "null"], format: date-time }
                  requestId: { type: string }
        "429":
          $ref: "#/components/responses/RateLimited"
  /conflicts/{conflictId}:
    get:
      operationId: getConflict
      parameters:
        - name: conflictId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Conflict detail (dual-collection authorized).
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - status
                  - severity
                  - conflictType
                  - claimAId
                  - claimBId
                  - collectionAId
                  - collectionBId
                  - resolutionNote
                  - resolvedAt
                  - requestId
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string }
                  severity: { type: string }
                  conflictType: { type: string }
                  claimAId: { type: string, format: uuid }
                  claimBId: { type: string, format: uuid }
                  collectionAId: { type: string, format: uuid }
                  collectionBId: { type: string, format: uuid }
                  resolutionNote: { type: [string, "null"] }
                  resolvedAt: { type: [string, "null"], format: date-time }
                  requestId: { type: string }
        "404":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /conflicts/{conflictId}/evidence:
    get:
      operationId: getConflictEvidence
      parameters:
        - name: conflictId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Immutable conflict evidence legs for an authorized conflict.
          content:
            application/json:
              schema:
                type: object
                required: [conflictId, status, items, requestId]
                properties:
                  conflictId: { type: string, format: uuid }
                  status: { type: string }
                  resolutionNote: { type: string, nullable: true }
                  resolvedAt: { type: string, format: date-time, nullable: true }
                  items:
                    type: array
                    items:
                      type: object
                  requestId: { type: string }
        "404":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /conflicts/{conflictId}/triage:
    post:
      operationId: triageConflict
      parameters:
        - name: conflictId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [resolved, accepted_exception, false_positive]
                resolutionNote:
                  type: string
      responses:
        "200":
          description: Conflict triage applied.
          content:
            application/json:
              schema:
                type: object
                required: [id, status, resolvedAt, requestId]
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string }
                  resolvedAt: { type: string, format: date-time }
                  requestId: { type: string }
        "404":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /jobs/{jobId}:
    get:
      operationId: getJob
      parameters:
        - $ref: "#/components/parameters/jobId"
      responses:
        "200":
          description: Job status (document collection authorized).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /jobs/{jobId}/events:
    get:
      operationId: jobEvents
      parameters:
        - $ref: "#/components/parameters/jobId"
        - name: lastEventId
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
      responses:
        "400":
          $ref: "#/components/responses/ApiError"
        "200":
          description: >
            Resumable SSE job events with durable event_log sequence, live-tail
            across worker restart, heartbeats, and per-poll principal revalidation.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/SseEnvelope"
        "401":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /search:
    post:
      operationId: search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Tenant-scoped hybrid search hits + citations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /ask:
    post:
      operationId: ask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskRequest"
      responses:
        "200":
          description: Grounded answer with claim-level citation validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskResponse"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /ask/stream:
    post:
      operationId: askStream
      parameters:
        - name: streamSessionId
          in: query
          required: false
          description: >
            Resume an existing durable ask stream against its pinned retrieval
            snapshot. When set, retrieval/provider are not re-run.
          schema:
            type: string
            format: uuid
        - name: lastEventId
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskRequest"
      responses:
        "200":
          description: >
            Sequenced SSE answer stream with durable session id, provider-token
            or extractive chunk streaming, Last-Event-ID replay, and per-batch
            principal revalidation.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/SseEnvelope"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /openapi.yaml:
    get:
      operationId: openapiYaml
      security: []
      responses:
        "200":
          description: Embedded OpenAPI document, served verbatim as raw YAML text.
          content:
            application/yaml:
              schema:
                type: string
        "429":
          $ref: "#/components/responses/RateLimited"
  /orgs:
    get:
      operationId: listOrgs
      summary: List organizations the caller currently has an active membership in
      description: >
        Authenticated bearer only (no existing OrgContext required) — the
        JWT's own org claim is never consulted. Never lists an org the
        caller does not currently belong to.
      responses:
        "200":
          description: Orgs the caller is an active member of.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgPage"
        "401":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      operationId: createOrg
      summary: Create a new organization; caller becomes its owner
      description: >
        Authenticated bearer only (no existing OrgContext required — the
        caller has no membership in the org being created). Creates the org
        and an `owner` membership for the caller in one transaction, and
        provisions the new org's roles/permissions from the global RBAC
        catalog (1C-03) — no per-org seed step required. Audited as
        `org.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrgRequest"
      responses:
        "201":
          description: Created org, with the caller's (owner) role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "409":
          description: Slug already taken by another organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /orgs/switch:
    post:
      operationId: switchOrg
      summary: Re-verify membership in a target org and mint a new session for it
      description: >
        Membership is re-checked against current PostgreSQL state — the
        request's orgId is untrusted input, same trust level as a JWT org
        claim. Mints an independent new refresh-token family scoped to the
        target org; the caller's session in their current org is untouched.
        Every deny against a real org is audited (org.switch, outcome=deny).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwitchOrgRequest"
      responses:
        "200":
          description: New access + refresh token pair scoped to the target org.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          description: >
            Forged/stale target org — membership missing, suspended, or the
            org does not exist (all three respond identically; see
            description above).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /orgs/{orgId}:
    parameters:
      - $ref: "#/components/parameters/orgId"
    get:
      operationId: getOrg
      summary: Organization detail, only if the caller is currently an active member
      description: >
        "No such org" and "org exists but caller is not an active member"
        render the identical 404 — no existence oracle for non-members.
      responses:
        "200":
          description: Organization detail plus the caller's role in it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
        "401":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /members:
    get:
      operationId: listMembers
      summary: List org members (requires member.manage)
      responses:
        "200":
          description: Memberships in the caller's current org (both active and suspended).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipPage"
        "403":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /members/invites:
    get:
      operationId: listMemberInvites
      summary: List invites, open and terminal (requires member.manage)
      responses:
        "200":
          description: Invites for the caller's current org. Never includes tokenHash.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitePage"
        "403":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      operationId: createMemberInvite
      summary: Create a single-use invite (requires member.manage; owner role requires an active owner caller)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteRequest"
      responses:
        "201":
          description: >
            Invite created. The plaintext token is returned exactly once here
            and is never retrievable again (only its hash is stored).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateInviteResponse"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /members/invites/accept:
    post:
      operationId: acceptMemberInvite
      summary: Accept an invite by token (authenticated bearer only — no existing org membership required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInviteRequest"
      responses:
        "201":
          description: Membership created in the invite's org.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          description: Invite already accepted/revoked, expired, or caller is already a member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /members/invites/{inviteId}/revoke:
    parameters:
      - $ref: "#/components/parameters/inviteId"
    post:
      operationId: revokeMemberInvite
      summary: Revoke an invite that has not yet been accepted/revoked (requires member.manage)
      responses:
        "200":
          description: Invite revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          description: Invite already accepted or revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /members/{userId}:
    parameters:
      - $ref: "#/components/parameters/userId"
    patch:
      operationId: patchMember
      summary: Change role and/or suspend/reactivate a member (requires member.manage; last-owner invariant enforced)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchMemberRequest"
      responses:
        "200":
          description: Membership updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          description: Operation would leave the org with zero active owners.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: deleteMember
      summary: Remove a member from the org (requires member.manage; last-owner invariant enforced)
      responses:
        "204":
          description: Member removed; refresh-token sessions invalidated.
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          description: Operation would leave the org with zero active owners.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /usage:
    get:
      operationId: getUsage
      summary: Aggregated per-resource usage/limit/reserved (requires member.manage)
      responses:
        "200":
          description: Usage snapshot for every quota ResourceKind.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageResponse"
        "403":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /audit:
    get:
      operationId: listAudit
      summary: >-
        List org audit log entries, newest first (requires audit.view).
        Read-only; audit_log is append-only and org-isolated by RLS.
      parameters:
        - name: limit
          in: query
          description: Page size (server default 50, clamped to [1, 100]).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          description: Opaque pagination cursor from a previous page's nextCursor.
          schema:
            type: string
        - name: action
          in: query
          description: >-
            Exact audit action code filter (closed enum, e.g.
            member.role_change, document.upload). Unknown values are rejected
            with 400.
          schema:
            type: string
        - name: actor
          in: query
          description: Filter to a specific actor user id.
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          description: Inclusive lower bound on occurredAt (RFC 3339).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Inclusive upper bound on occurredAt (RFC 3339).
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Paginated audit log entries for the caller's current org.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        "400":
          description: Invalid action/actor/from/to/cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    collectionId:
      name: collectionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    documentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    versionId:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    jobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    inviteId:
      name: inviteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    userId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    orgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ApiError:
      description: Canonical API error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    RateLimited:
      description: Rate limited
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    Health:
      type: object
      required: [status, requestId]
      properties:
        status:
          type: string
          enum: [ok]
        requestId:
          type: string
          format: uuid
    ApiError:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
          format: uuid
        details: {}
    PageInfo:
      type: object
      required: [hasMore]
      properties:
        nextCursor:
          type: [string, "null"]
        hasMore:
          type: boolean
    Collection:
      type: object
      required: [id, name, slug, visibility, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: [string, "null"]
        visibility:
          type: string
        createdAt:
          type: string
          format: date-time
    CollectionPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Collection"
        page:
          $ref: "#/components/schemas/PageInfo"
    CitationPin:
      type: object
      required:
        - citeId
        - sourceContentSha256
        - canonicalMarkdownSha256
        - quoteSha256
        - chunkIdentitySha256
        - quote
        - sourceSpanStart
        - sourceSpanEnd
        - quoteLocalStart
        - quoteLocalEnd
      properties:
        citeId:
          type: string
        sourceContentSha256:
          type: string
          description: Original uploaded/source object SHA-256
        canonicalMarkdownSha256:
          type: string
          description: Trusted canonical Markdown artifact SHA-256
        quoteSha256:
          type: string
          description: SHA-256 of exact UTF-8 quote bytes
        chunkIdentitySha256:
          type: string
        quote:
          type: string
        sourceSpanStart:
          type: integer
          description: Absolute UTF-8 byte offset into canonical Markdown
        sourceSpanEnd:
          type: integer
        quoteLocalStart:
          type: integer
          description: UTF-8 byte offset into immutable chunk body
        quoteLocalEnd:
          type: integer
        page:
          type: integer
        slide:
          type: integer
        sheet:
          type: string
        isCurrent:
          type: boolean
        anchor:
          type: string
    ResolveCitationRequest:
      type: object
      required:
        - logicalDocumentId
        - versionId
        - sourceContentSha256
        - canonicalMarkdownSha256
        - chunkId
        - sourceSpanStart
        - sourceSpanEnd
        - quoteLocalStart
        - quoteLocalEnd
        - quote
      properties:
        logicalDocumentId:
          type: string
          format: uuid
        versionId:
          type: string
          format: uuid
        sourceContentSha256:
          type: string
        canonicalMarkdownSha256:
          type: string
        chunkId:
          type: string
          format: uuid
        sourceSpanStart:
          type: integer
        sourceSpanEnd:
          type: integer
        quoteLocalStart:
          type: integer
        quoteLocalEnd:
          type: integer
        quote:
          type: string
        requireCurrent:
          type: boolean
          default: false
    ExtractorError:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
          enum:
            - extractor_unsupported_format
            - extractor_timeout
            - extractor_sandbox_killed
            - extractor_corrupt_input
        message:
          type: string
        requestId:
          type: string
    SseEnvelope:
      type: object
      required: [version, sequence, event, requestId, data]
      properties:
        version:
          type: integer
        sequence:
          type: integer
          format: int64
        event:
          type: string
        requestId:
          type: string
        data: {}
    SearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
        collectionIds:
          type: array
          items:
            type: string
            format: uuid
        mode:
          type: string
          enum: [current, as_of, compare, history]
        asOf:
          type: string
          format: date-time
        documentId:
          type: string
          format: uuid
        versionA:
          type: string
          format: uuid
        versionB:
          type: string
          format: uuid
        limit:
          type: integer
          minimum: 1
          maximum: 100
        conflictIds:
          type: array
          items:
            type: string
            format: uuid
    SearchResponse:
      type: object
      required: [hits, citations, requestId]
      properties:
        hits:
          type: array
          items:
            type: object
            additionalProperties: true
        citations:
          type: array
          items:
            $ref: "#/components/schemas/CitationPin"
        requestId:
          type: string
          format: uuid
        warnings:
          type: array
          items:
            type: string
    AskRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
        collectionIds:
          type: array
          items:
            type: string
            format: uuid
        mode:
          type: string
          enum: [current, as_of, compare, history]
        asOf:
          type: string
          format: date-time
        documentId:
          type: string
          format: uuid
        versionA:
          type: string
          format: uuid
        versionB:
          type: string
          format: uuid
        limit:
          type: integer
          minimum: 1
          maximum: 20
        conflictIds:
          type: array
          items:
            type: string
            format: uuid
    AskResponse:
      type: object
      required: [answer, mode, citations, requestId]
      properties:
        answer:
          type: string
        mode:
          type: string
          description: >-
            offline_extractive|fallback_extractive|local_llm|cloud_llm|
            subscription_cli|llm_unverified. Free-form string (not a closed
            enum) so new modes can ship without a schema bump. llm_unverified
            is a dev-gate-only value (env MARKHAND_QA_ALLOW_UNVERIFIED_LLM,
            default off): the LLM answer passed citation/claim validation but
            structured entailment is still unavailable, so it is never
            grounded — the response always carries a matching warning.
        citations:
          type: array
          items:
            $ref: "#/components/schemas/CitationPin"
        warnings:
          type: array
          items:
            type: string
        versionContext:
          type: object
          additionalProperties: true
        embeddingMode:
          type: string
        requestId:
          type: string
          format: uuid
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          description: >
            Travels in the JSON body, not a cookie. Shared shape for
            POST /auth/refresh and POST /auth/logout.
    TokenResponse:
      type: object
      required:
        [accessToken, refreshToken, tokenType, expiresIn, orgId, userId]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
        orgId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
    MeResponse:
      type: object
      required:
        - userId
        - orgId
        - email
        - displayName
        - permissions
        - allowedCollectionIds
        - sessionId
      properties:
        userId:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        permissions:
          type: array
          items:
            type: string
        allowedCollectionIds:
          type: array
          items:
            type: string
            format: uuid
        sessionId:
          type: string
    Org:
      type: object
      required: [id, slug, name, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        role:
          type: string
          description: The CALLER's role in this org (not a role catalog).
          enum: [owner, admin, editor, viewer]
        createdAt:
          type: string
          format: date-time
    CreateOrgRequest:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
          description: 2-63 lowercase alphanumeric/hyphen chars, must not start with a hyphen.
        name:
          type: string
    OrgPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Org"
        page:
          $ref: "#/components/schemas/PageInfo"
    SwitchOrgRequest:
      type: object
      required: [orgId]
      properties:
        orgId:
          type: string
          format: uuid
    CreateCollectionRequest:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        visibility:
          type: string
          enum: [private, org, groups]
          default: org
    UpdateCollectionRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: [string, "null"]
    Document:
      type: object
      required:
        [id, collectionId, title, state, currentVersionId, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        collectionId:
          type: string
          format: uuid
        title:
          type: string
        state:
          type: string
          enum:
            [uploaded, converting, converted, indexing, indexed, failed, tombstoned, purged]
        currentVersionId:
          type: [string, "null"]
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DocumentPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Document"
        page:
          $ref: "#/components/schemas/PageInfo"
    DocumentVersion:
      type: object
      required:
        - id
        - documentId
        - versionNumber
        - isCurrent
        - sourceContentSha256
        - effectiveFrom
        - effectiveTo
        - changeSummary
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        versionNumber:
          type: integer
        isCurrent:
          type: boolean
        sourceContentSha256:
          type: string
          description: Original uploaded/source object SHA-256.
        effectiveFrom:
          type: string
          format: date-time
        effectiveTo:
          type: [string, "null"]
          format: date-time
        changeSummary:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
    DocumentVersionPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DocumentVersion"
        page:
          $ref: "#/components/schemas/PageInfo"
    Job:
      type: object
      required:
        [id, jobType, status, attempts, documentId, versionId, createdAt, updatedAt, finishedAt]
      properties:
        id:
          type: string
          format: uuid
        jobType:
          type: string
          enum:
            [convert, index, delete, reconcile, embedding_batch, lifecycle_refresh]
        status:
          type: string
          enum:
            [pending, leased, running, succeeded, failed, cancelled, dead_letter]
        attempts:
          type: integer
        documentId:
          type: [string, "null"]
          format: uuid
        versionId:
          type: [string, "null"]
          format: uuid
        requestId:
          type: string
          format: uuid
          description: >
            Server-minted request correlation id from the job payload, when
            present; omitted entirely if the payload has none.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
    Membership:
      type: object
      required: [userId, email, displayName, role, state, createdAt]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [owner, admin, editor, viewer]
        state:
          type: string
          enum: [active, suspended]
        createdAt:
          type: string
          format: date-time
    MembershipPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Membership"
        page:
          $ref: "#/components/schemas/PageInfo"
    Invite:
      type: object
      required: [id, email, role, status, expiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [owner, admin, editor, viewer]
        status:
          type: string
          description: Derived, not stored — never both terminal and pending.
          enum: [pending, accepted, revoked, expired]
        expiresAt:
          type: string
          format: date-time
        acceptedAt:
          type: [string, "null"]
          format: date-time
        revokedAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
    InvitePage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Invite"
        page:
          $ref: "#/components/schemas/PageInfo"
    CreateInviteRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
        role:
          type: string
          enum: [owner, admin, editor, viewer]
        ttlSecs:
          type: integer
          description: Invite lifetime in seconds (default 7 days; clamped [60, 2592000]).
    CreateInviteResponse:
      type: object
      required: [invite, token]
      properties:
        invite:
          $ref: "#/components/schemas/Invite"
        token:
          type: string
          description: >
            Plaintext single-use invite token, returned exactly once. Only its
            hash is ever persisted — this value cannot be retrieved again.
    AcceptInviteRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
    PatchMemberRequest:
      type: object
      description: At least one of role/state must be present.
      properties:
        role:
          type: string
          enum: [owner, admin, editor, viewer]
        state:
          type: string
          enum: [active, suspended]
    UsageEntry:
      type: object
      required: [resource, limit, committed, reserved, remaining]
      properties:
        resource:
          type: string
          enum: [storage_bytes, documents, concurrent_jobs, tokens]
        limit:
          type: integer
        committed:
          type: integer
        reserved:
          type: integer
        remaining:
          type: integer
    UsageResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UsageEntry"
    AuditEntry:
      type: object
      required:
        - id
        - seq
        - action
        - targetType
        - outcome
        - metadata
        - occurredAt
      properties:
        id:
          type: string
          format: uuid
        seq:
          type: integer
          format: int64
        actorId:
          type: [string, "null"]
          format: uuid
        action:
          type: string
        targetType:
          type: string
        targetId:
          type: [string, "null"]
        outcome:
          type: string
          enum: [success, deny, error, intent]
        metadata:
          type: object
          description: >-
            Per-action scalar allowlist only (services::audit::sanitize_for_action)
            — never document content, prompts, tokens, or PII.
        requestId:
          type: [string, "null"]
          format: uuid
        occurredAt:
          type: string
          format: date-time
    AuditPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        page:
          $ref: "#/components/schemas/PageInfo"
