[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "markhand-ocr-benchmark"
version = "0.1.0"
description = "Bounded, model-neutral OCR benchmark tooling"
requires-python = ">=3.12"
dependencies = [
    "Pillow>=12.3.0",
    "psutil>=7.2.2",
    "pypdfium2>=5.12.1",
]

[project.optional-dependencies]
build = [
    "setuptools==83.0.0",
]
test = [
    "pytest>=9.1.1",
]

[tool.setuptools.packages.find]
include = ["benchmark*", "corpus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
