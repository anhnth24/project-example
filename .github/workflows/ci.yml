name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Manual entry point for the opt-in live gates (see phase1b-o04-release-gate).
  workflow_dispatch:

permissions:
  contents: read

# Một ref chỉ cần run mới nhất. Commit mới trên cùng PR sẽ hủy run cũ.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  # PR commit mới thay thế commit cũ. Master runs không được hủy nhau vì mỗi run
  # phân loại delta riêng; hủy run trước có thể bỏ sót gate của delta đó.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes-and-static:
    runs-on: ubuntu-22.04
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
      rust_crates: ${{ steps.changes.outputs.rust_crates }}
      rust_desktop_deps: ${{ steps.changes.outputs.rust_desktop_deps }}
      knowledge: ${{ steps.changes.outputs.knowledge }}
      frontend: ${{ steps.changes.outputs.frontend }}
      web: ${{ steps.changes.outputs.web }}
      dev_stack: ${{ steps.changes.outputs.dev_stack }}
      dev_stack_mode: ${{ steps.changes.outputs.dev_stack_mode }}
      bundle: ${{ steps.changes.outputs.bundle }}
      toolchain: ${{ steps.changes.outputs.toolchain }}
      corpus: ${{ steps.changes.outputs.corpus }}
      deploy_images: ${{ steps.changes.outputs.deploy_images }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - id: changes
        name: Classify changed paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # workflow_dispatch carries neither a PR base nor a push "before", and
          # the classifier requires a base. Fall back to the default branch so a
          # manual run still classifies paths instead of failing the whole job.
          python3 scripts/classify-ci-changes.py \
            --base "${BASE_SHA:-origin/$DEFAULT_BRANCH}" \
            --head HEAD \
            --github-output "$GITHUB_OUTPUT"
      - run: bash scripts/check-foundation-gate.sh --static-only

  rust:
    needs: changes-and-static
    if: needs.changes-and-static.outputs.rust == 'true'
    runs-on: ubuntu-22.04
    env:
      RUST_CRATES: ${{ needs.changes-and-static.outputs.rust_crates }}
      KNOWLEDGE_GATE: ${{ needs.changes-and-static.outputs.knowledge }}
      RUST_INTEGRATION: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      # Compiler-output cache across runs/jobs (survives Cargo.lock churn better than
      # target/ caching). Incremental off is recommended with sccache.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # The knowledge-extraction gate compiles fileconv-desktop, which links
      # GTK/webkit — so the desktop GUI libs are needed whenever desktop deps
      # OR the knowledge gate runs, not just when app/ changed. Missing this is
      # what made knowledge-only PRs fail on gdk-3.0 after ~15 min of compiling.
      - name: Install native build dependencies (with desktop GUI libs)
        if: needs.changes-and-static.outputs.rust_desktop_deps == 'true' || needs.changes-and-static.outputs.knowledge == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf
      - name: Install base build dependencies
        if: needs.changes-and-static.outputs.rust_desktop_deps != 'true' && needs.changes-and-static.outputs.knowledge != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Rust fmt, clippy, and tests
        run: bash scripts/run-rust-ci-fast.sh

  rust-integration:
    needs: changes-and-static
    # DB-backed acceptance tests in crates/server/tests/*.rs are `#[ignore]`
    # gated on MARKHAND_TEST_DATABASE_URL / MARKHAND_TEST_MINIO_* /
    # MARKHAND_TEST_QDRANT_URL. The fast `rust` job never sets those vars or
    # passes `--include-ignored`, so this job is the only place they actually
    # run. Gate matches what already makes the fast job exercise
    # fileconv-server (full/workspace/smoke rust_crates or a scope containing
    # "server"), plus knowledge changes (future-proofing: no ignored DB tests
    # live under crates/knowledge today, but the pattern is the same), plus
    # every master push so regressions can't merge silently.
    if: >-
      needs.changes-and-static.outputs.rust == 'true' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
        needs.changes-and-static.outputs.rust_crates == 'full' ||
        needs.changes-and-static.outputs.rust_crates == 'workspace' ||
        needs.changes-and-static.outputs.rust_crates == 'smoke' ||
        contains(needs.changes-and-static.outputs.rust_crates, 'server') ||
        needs.changes-and-static.outputs.knowledge == 'true'
      )
    runs-on: ubuntu-22.04
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
      # Dual-role DB URLs (deploy/dev/compose.yml defaults):
      # - admin/superuser: CREATE/DROP ephemeral databases + migrate
      # - markhand_app: application pool for FORCE RLS / tenant assertions
      MARKHAND_TEST_DATABASE_URL: postgresql://markhand:markhand_dev_only@127.0.0.1:54329/markhand
      MARKHAND_TEST_APP_DATABASE_URL: postgresql://markhand_app:markhand_app_dev_only@127.0.0.1:54329/markhand
      MARKHAND_TEST_MINIO_ENDPOINT: http://127.0.0.1:9000
      MARKHAND_TEST_MINIO_ACCESS_KEY: markhand
      MARKHAND_TEST_MINIO_SECRET_KEY: markhand_dev_only
      MARKHAND_TEST_MINIO_REGION: us-east-1
      MARKHAND_TEST_QDRANT_URL: http://127.0.0.1:6333
      # Local compose Qdrant has auth disabled; value is required by admin client
      # construction (see tests/common/worker_pipeline.rs). Missing this previously
      # soft-skipped retrieval_vertical_slice to a false green in CI.
      MARKHAND_TEST_QDRANT_ADMIN_API_KEY: test-operator-admin-key
      # Forbid prerequisite soft-skips in this job — missing DB/app/MinIO must fail.
      MARKHAND_TEST_REQUIRED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install base build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config \
            tesseract-ocr tesseract-ocr-vie
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.88.0
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Start Postgres, Qdrant, MinIO (deploy/dev/compose.yml)
        # Only the three services the integration tests actually need — not
        # the full dev stack (otel/embedding are irrelevant here and would
        # only slow the job down; index_worker.rs uses an in-process mock
        # embedding TCP server instead).
        run: docker compose -f deploy/dev/compose.yml up -d postgres qdrant minio
      - name: Wait for Postgres/Qdrant/MinIO to be ready
        run: |
          set -euo pipefail
          COMPOSE=(docker compose -f deploy/dev/compose.yml)

          postgres_ready=false
          for _ in $(seq 1 60); do
            id="$("${COMPOSE[@]}" ps -q postgres)"
            if [[ -n "$id" ]] && [[ "$(docker inspect --format '{{.State.Health.Status}}' "$id")" == "healthy" ]]; then
              echo "healthy: postgres"
              postgres_ready=true
              break
            fi
            sleep 1
          done
          if [[ "$postgres_ready" != "true" ]]; then
            echo "unhealthy: postgres" >&2
            "${COMPOSE[@]}" logs postgres >&2 || true
            exit 1
          fi

          qdrant_ready=false
          for _ in $(seq 1 90); do
            if curl --fail --silent --show-error http://127.0.0.1:6333/healthz >/dev/null; then
              echo "healthy: qdrant"
              qdrant_ready=true
              break
            fi
            sleep 1
          done
          if [[ "$qdrant_ready" != "true" ]]; then
            echo "unhealthy: qdrant" >&2
            "${COMPOSE[@]}" logs qdrant >&2 || true
            exit 1
          fi

          minio_ready=false
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:9000/minio/health/live >/dev/null; then
              echo "healthy: minio"
              minio_ready=true
              break
            fi
            sleep 1
          done
          if [[ "$minio_ready" != "true" ]]; then
            echo "unhealthy: minio" >&2
            "${COMPOSE[@]}" logs minio >&2 || true
            exit 1
          fi
      - name: Bootstrap non-superuser markhand_app role
        run: bash deploy/scripts/bootstrap-server-role.sh
      - name: Rust DB-backed integration tests (fileconv-server, --include-ignored)
        id: integration_tests
        # Blocking gate. Skip the live E2E opt-in test so missing MARKHAND_E2E
        # stays an honest not_run (#[ignore] + --skip), not a soft-return pass.
        # retrieval_vertical_slice runs ConvertWorker against target/debug/fileconv;
        # build fileconv-cli first (no audio — vertical slice only needs text formats).
        # Use cargo --no-fail-fast so one red binary still surfaces the full backlog.
        run: >-
          cargo build -p fileconv-cli --no-default-features &&
          cargo test -p fileconv-server --no-fail-fast --
          --include-ignored
          --skip e2e_live_vertical_slice
          --skip e2e_phase1c_gate
      - name: Run Phase 1C denial suite
        id: phase1c_denial_suite
        if: steps.integration_tests.outcome == 'success'
        # Re-run manifest-scoped integration binaries for a sanitized artifact.
        # fileconv-cli is already built by the broad integration step above.
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phase1c-denial"
          python3 scripts/run-phase1c-denial-suite.py \
            --manifest crates/server/tests/fixtures/multi-org-denial.manifest.json \
            --output "$RUNNER_TEMP/phase1c-denial/manifest-run.json"
      - name: Dump service logs on failure
        if: >-
          steps.integration_tests.outcome == 'failure' ||
          steps.phase1c_denial_suite.outcome == 'failure'
        run: docker compose -f deploy/dev/compose.yml logs --tail=200
      - name: Verify Phase 1C denial artifact
        if: always() && steps.integration_tests.outcome == 'success'
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/phase1c-denial/manifest-run.json"
      - name: Upload Phase 1C denial artifact
        if: always() && steps.integration_tests.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase1c-denial-${{ github.sha }}
          path: ${{ runner.temp }}/phase1c-denial/manifest-run.json
          if-no-files-found: error
          retention-days: 30
      - name: Tear down dev services
        if: always()
        run: docker compose -f deploy/dev/compose.yml down -v

  # Fast SCA gate (P2-15 OWASP baseline, tier 1): known-CVE check on both
  # dependency graphs. Unconditional — no infra needed, seconds-long, and a
  # known-vulnerable lockfile entry should block a merge immediately, same as
  # a compile/lint/test failure would in the rust/web jobs. Kept as its own
  # job (not folded into rust/web) so it reports as a distinct, clearly-named
  # check in branch protection.
  security-deps:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      # rustsec/audit-check needs to write a commit status/check for the scan
      # result; the workflow-level `permissions: contents: read` would
      # otherwise leave it unable to report anything but stdout.
      checks: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Rust dependency audit (cargo-audit / RustSec advisory DB)
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # --audit-level high: fail on High/Critical advisories only; Low/Moderate
      # are reported but non-blocking (npm advisory DB is noisy at low severity
      # for dev-only deps, per the OWASP-baseline research recommendation).
      - name: JS/TS dependency audit (pnpm audit)
        run: pnpm audit --audit-level high

  # Container image scan (P2-15 OWASP baseline, tier 1): Trivy against the two
  # images actually shipped (deploy/Dockerfile.server, deploy/Dockerfile.worker).
  # Gated like linux-bundle: only when deploy/** changed, or unconditionally on
  # a master push so a base-image CVE can't merge silently on an unrelated PR.
  security-image:
    needs: changes-and-static
    if: >-
      needs.changes-and-static.outputs.deploy_images == 'true' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build server image
        run: docker build -f deploy/Dockerfile.server -t markhand-security-scan/server:${{ github.sha }} .
      - name: Build worker image
        run: docker build -f deploy/Dockerfile.worker -t markhand-security-scan/worker:${{ github.sha }} .
      - name: Scan server image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: markhand-security-scan/server:${{ github.sha }}
          scan-type: image
          severity: HIGH,CRITICAL
          exit-code: "1"
          # Debian base packages routinely carry HIGH/CRITICAL CVEs the
          # distro marks will_not_fix/fix_deferred (no fixed version to move
          # to) — gate only on findings that have an available fix.
          ignore-unfixed: true
          trivyignores: .trivyignore
      - name: Scan worker image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: markhand-security-scan/worker:${{ github.sha }}
          scan-type: image
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore

  toolchain:
    needs: changes-and-static
    if: needs.changes-and-static.outputs.toolchain == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.88.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: make check-toolchain

  # Opt-in, not per-push: this gate boots the whole POC stack and builds the
  # release server image inside Docker with no layer cache across runners, which
  # the .dockerignore header measures at ~20 minutes. Qualifying the POC belongs
  # to a deliberate run before a phase closes, not to every commit. Trigger it
  # with a manual workflow_dispatch, or by putting the `run-live-gates` label on
  # a pull request.
  phase1b-o04-release-gate:
    needs: changes-and-static
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-live-gates')
    runs-on: ubuntu-22.04
    env:
      GITHUB_SHA: ${{ github.sha }}
      MARKHAND_E2E: "1"
      MARKHAND_O04_API_PASSWORD: markhand-dev
      MARKHAND_O04_EXTERNAL_WORKER_KILL: "1"
    steps:
      # `runner` context không dùng được ở job-level `env` (chỉ github/needs/vars/...),
      # đặt ở đó làm cả workflow bị từ chối lúc startup. Export trong step.
      - name: Resolve O04 output dir
        run: echo "O04_OUTPUT_DIR=$RUNNER_TEMP/markhand-o04-release" >> "$GITHUB_ENV"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install O04 native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config \
            tesseract-ocr tesseract-ocr-vie shellcheck apparmor
      # The convert worker runs under this profile (docker-default plus `mount,`)
      # because its nested sandbox remounts / as MS_REC|MS_PRIVATE. The runner
      # has AppArmor enabled, so Docker rejects the container until the profile
      # is loaded.
      - name: Load the convert sandbox AppArmor profile
        run: sudo apparmor_parser -r -W deploy/poc/apparmor-markhand-convert
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.88.0
      - name: Boot POC Compose stack
        run: |
          cp deploy/.env.example deploy/.env
          deploy/scripts/poc-up.sh
          deploy/scripts/poc-health.sh
      - name: Seed POC password
        run: |
          hash="$(cargo run -q -p fileconv-server --bin dev-hash-password -- "$MARKHAND_O04_API_PASSWORD")"
          hash_sql="${hash//\'/\'\'}"
          docker compose -f deploy/compose.poc.yml exec -T postgres psql \
            -U markhand -d markhand --set ON_ERROR_STOP=1 \
            -c "UPDATE users SET password_hash = '${hash_sql}', updated_at = now() WHERE email = 'admin@poc.example';"
      - name: Build CLI for vertical conversion
        run: cargo build -p fileconv-cli --no-default-features
      - name: Collect F02 evidence
        run: POC_F02_CLEAN_BOOT=1 deploy/scripts/poc-boot-evidence.sh
      - name: Generate and validate O04 release gate
        run: bash deploy/scripts/o04-release-suite.sh --release-gate --nocapture
      - name: Upload O04 release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase1b-o04-release-${{ github.sha }}
          path: ${{ runner.temp }}/markhand-o04-release/**
      - name: Dump POC logs on failure
        if: failure()
        run: docker compose -f deploy/compose.poc.yml logs --tail=200 || true
      - name: Tear down POC stack
        if: always()
        run: docker compose -f deploy/compose.poc.yml down -v

  # Phase 1C G1C-SEC qualification harness (Task 16). Opt-in like O04: boots POC,
  # seeds two orgs, runs g1c-security-gate.sh, validates phase-1c-gate.json.
  # rust-integration explicitly skips e2e_phase1c_gate; this job is the only
  # place the ignored test runs with MARKHAND_PHASE1C_GATE=1.
  phase1c-g1c-security-gate:
    needs: changes-and-static
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-phase1c-gate')
    runs-on: ubuntu-22.04
    env:
      MARKHAND_PHASE1C_GATE: "1"
      MARKHAND_TEST_REQUIRED: "1"
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - name: Resolve Phase 1C gate output dir
        run: echo "MARKHAND_PHASE1C_OUTPUT_DIR=$RUNNER_TEMP/markhand-phase1c-gate" >> "$GITHUB_ENV"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config \
            tesseract-ocr tesseract-ocr-vie shellcheck apparmor
      - name: Load the convert sandbox AppArmor profile
        run: sudo apparmor_parser -r -W deploy/poc/apparmor-markhand-convert
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.88.0
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Boot POC Compose stack
        run: |
          cp deploy/.env.example deploy/.env
          deploy/scripts/poc-up.sh
          deploy/scripts/poc-health.sh
      - name: Run G1C security gate harness
        id: g1c_gate
        run: |
          set +e
          bash deploy/scripts/g1c-security-gate.sh \
            --output-dir "$MARKHAND_PHASE1C_OUTPUT_DIR"
          exit_code=$?
          echo "gate_exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Dump POC logs on failure
        if: failure()
        run: docker compose -f deploy/compose.poc.yml logs --tail=200 || true
      - name: Tear down POC stack
        id: g1c_teardown
        if: always()
        run: |
          set +e
          docker compose -f deploy/compose.poc.yml down -v
          exit_code=$?
          echo "teardown_exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Enforce G1C gate
        if: always()
        run: |
          set -euo pipefail
          fail=0
          gate_exit="${{ steps.g1c_gate.outputs.gate_exit_code }}"
          teardown_exit="${{ steps.g1c_teardown.outputs.teardown_exit_code }}"
          if [ -z "${gate_exit:-}" ] || [ "$gate_exit" -ne 0 ]; then
            echo "G1C harness exited ${gate_exit:-missing}" >&2
            fail=1
          fi
          if [ -z "${teardown_exit:-}" ] || [ "$teardown_exit" -ne 0 ]; then
            echo "POC teardown exited ${teardown_exit:-missing}" >&2
            fail=1
          fi
          MARKHAND_PHASE1C_GATE=1 \
          MARKHAND_PHASE1C_REPORT_PATH="${MARKHAND_PHASE1C_OUTPUT_DIR}/phase-1c-gate.json" \
          GITHUB_SHA="${{ github.sha }}" \
          cargo test -p fileconv-server --test e2e_phase1c_gate -- --ignored e2e_phase1c_gate --nocapture \
            || fail=1
          exit "$fail"
      - name: Upload Phase 1C gate failure report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase1c-g1c-security-gate-failure-${{ github.sha }}
          path: ${{ runner.temp }}/markhand-phase1c-gate/phase1c-gate-failure.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Phase 1C gate evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase1c-g1c-security-gate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/markhand-phase1c-gate/**
          if-no-files-found: warn
          retention-days: 30

  # Phase 1C exit-gate infrastructure (1C-12 denial suite / 1C-13 security-load
  # gate; bench/markhand_web/gates.yaml, failureDisposition block-phase-1c).
  # Cloned from phase1b-o04-release-gate's boot/teardown shape: same opt-in
  # trigger, same POC stack via deploy/scripts/poc-up.sh + poc-health.sh. Runs
  # the canonical manifest runner (scripts/run-phase1c-denial-suite.py) against
  # the deployed POC stack (deploy/compose.poc.yml ports/credentials, not
  # deploy/dev/compose.yml's used by rust-integration), so a pass here is
  # evidence for the "deployed environment" half of 1C-12's "CI AND deployed
  # green" acceptance criteria — rust-integration already covers the CI half.
  # 1C-13 remains explicitly not_run in the Markdown artifact; this job does
  # not measure load/revoke/fairness thresholds. No branch protection required
  # check yet — informational until branch protection adopts this gate.
  deployed-1c-integration:
    needs: changes-and-static
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-live-gates')
    runs-on: ubuntu-22.04
    env:
      # deploy/compose.poc.yml port/credential defaults (deploy/.env.example) —
      # deliberately not deploy/dev/compose.yml's (rust-integration's env
      # block): this job exercises the deployed POC stack on its own port
      # range/credentials, not the ephemeral dev services.
      MARKHAND_TEST_DATABASE_URL: postgresql://markhand:markhand_poc_change_me@127.0.0.1:54330/markhand
      MARKHAND_TEST_APP_DATABASE_URL: postgresql://markhand_app:markhand_app_poc_change_me@127.0.0.1:54330/markhand
      MARKHAND_TEST_MINIO_ENDPOINT: http://127.0.0.1:9010
      # Ephemeral integration buckets (markhand-it-*) need MinIO admin; narrow
      # markhand_app policy is scoped to MARKHAND_MINIO_BUCKET only (see
      # deploy/poc/minio-init.sh). Root fixture creds are bootstrap-only in
      # deploy/.env.example — not application/worker container identity.
      MARKHAND_TEST_MINIO_ACCESS_KEY: markhand_root
      MARKHAND_TEST_MINIO_SECRET_KEY: markhand_root_poc_change_me
      MARKHAND_TEST_MINIO_REGION: us-east-1
      MARKHAND_TEST_QDRANT_URL: http://127.0.0.1:6343
      # POC Qdrant has auth disabled like dev's; value only satisfies admin
      # client construction (see tests/common/worker_pipeline.rs).
      MARKHAND_TEST_QDRANT_ADMIN_API_KEY: test-operator-admin-key
      # Forbid prerequisite soft-skips — missing DB/app/MinIO must fail closed.
      MARKHAND_TEST_REQUIRED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config \
            tesseract-ocr tesseract-ocr-vie shellcheck apparmor
      # See phase1b-o04-release-gate's own comment: the convert worker's nested
      # sandbox needs the same AppArmor profile loaded to boot.
      - name: Load the convert sandbox AppArmor profile
        run: sudo apparmor_parser -r -W deploy/poc/apparmor-markhand-convert
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.88.0
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Resolve 1C report dir and manifest digest
        run: |
          set -euo pipefail
          echo "MARKHAND_1C_OUTPUT_DIR=$RUNNER_TEMP/markhand-1c-integration" >> "$GITHUB_ENV"
          manifest_sha=$(python3 -c "import hashlib; from pathlib import Path; print(hashlib.sha256(Path('crates/server/tests/fixtures/multi-org-denial.manifest.json').read_bytes()).hexdigest())")
          echo "PHASE1C_MANIFEST_SHA256=$manifest_sha" >> "$GITHUB_ENV"
      - name: Boot POC Compose stack
        run: |
          cp deploy/.env.example deploy/.env
          deploy/scripts/poc-up.sh
          deploy/scripts/poc-health.sh
      - name: Run Phase 1C denial suite (deployed POC stack)
        id: phase1c_denial_suite
        # Capture runner exit code without failing the step yet so teardown,
        # render, upload, and final enforcement can still run on failure.
        run: |
          set +e
          set -u
          mkdir -p "$MARKHAND_1C_OUTPUT_DIR"
          cargo build -p fileconv-cli --no-default-features
          build_code=$?
          if [ "$build_code" -ne 0 ]; then
            echo "runner_exit_code=$build_code" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/run-phase1c-denial-suite.py \
            --manifest crates/server/tests/fixtures/multi-org-denial.manifest.json \
            --output "$MARKHAND_1C_OUTPUT_DIR/manifest-run.json"
          exit_code=$?
          echo "runner_exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Dump POC logs on failure
        if: failure()
        run: docker compose -f deploy/compose.poc.yml logs --tail=200 || true
      - name: Tear down POC stack
        id: phase1c_teardown
        if: always()
        run: |
          set +e
          docker compose -f deploy/compose.poc.yml down -v
          exit_code=$?
          echo "teardown_exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Render Phase 1C denial report
        id: phase1c_render
        if: always()
        env:
          PHASE1C_SOURCE_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set +e
          set -u
          runner_exit="${{ steps.phase1c_denial_suite.outputs.runner_exit_code }}"
          teardown_exit="${{ steps.phase1c_teardown.outputs.teardown_exit_code }}"
          if [ -z "${runner_exit:-}" ]; then
            runner_exit=1
          fi
          if [ -z "${teardown_exit:-}" ]; then
            teardown_exit=1
          fi
          input_failure_category="runner output missing"
          if [ -z "${{ steps.phase1c_denial_suite.outputs.runner_exit_code }}" ]; then
            input_failure_category="runner step incomplete"
          fi
          python3 scripts/render-phase1c-denial-report.py \
            --input "$MARKHAND_1C_OUTPUT_DIR/manifest-run.json" \
            --output "$MARKHAND_1C_OUTPUT_DIR/phase1c-denial-report.md" \
            --expected-git-sha "${{ github.sha }}" \
            --expected-manifest-sha256 "$PHASE1C_MANIFEST_SHA256" \
            --expected-git-ref "$PHASE1C_SOURCE_REF" \
            --ci-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --runner-exit-code "$runner_exit" \
            --teardown-exit-code "$teardown_exit" \
            --input-failure-category "$input_failure_category"
          render_exit=$?
          echo "render_exit_code=$render_exit" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload 1C integration report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployed-1c-integration-${{ github.sha }}
          path: |
            ${{ runner.temp }}/markhand-1c-integration/manifest-run.json
            ${{ runner.temp }}/markhand-1c-integration/phase1c-denial-report.md
          if-no-files-found: error
      - name: Enforce 1C-12 deployed gate
        if: always()
        run: |
          set -euo pipefail
          fail=0
          runner_exit="${{ steps.phase1c_denial_suite.outputs.runner_exit_code }}"
          teardown_exit="${{ steps.phase1c_teardown.outputs.teardown_exit_code }}"
          render_exit="${{ steps.phase1c_render.outputs.render_exit_code }}"
          if [ -z "${runner_exit:-}" ]; then
            echo "runner exit code unavailable (boot or earlier step failed)" >&2
            fail=1
          elif [ "$runner_exit" -ne 0 ]; then
            echo "Phase 1C denial runner exited $runner_exit" >&2
            fail=1
          fi
          if [ -z "${teardown_exit:-}" ]; then
            echo "teardown exit code unavailable" >&2
            fail=1
          elif [ "$teardown_exit" -ne 0 ]; then
            echo "POC teardown exited $teardown_exit" >&2
            fail=1
          fi
          if [ -z "${render_exit:-}" ]; then
            echo "render exit code unavailable" >&2
            fail=1
          elif [ "$render_exit" -ne 0 ]; then
            echo "Phase 1C denial report render exited $render_exit" >&2
            fail=1
          fi
          test -f "$MARKHAND_1C_OUTPUT_DIR/manifest-run.json" || fail=1
          test -f "$MARKHAND_1C_OUTPUT_DIR/phase1c-denial-report.md" || fail=1
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi

  # OWASP baseline DAST gate (P2-15). Cloned from phase1b-o04-release-gate's
  # boot/teardown shape: same opt-in trigger, same POC stack via
  # deploy/scripts/poc-up.sh + poc-health.sh. ZAP baseline is passive-only
  # (headers/cookies/information disclosure) — it does not authenticate or
  # exercise business logic, so it is not a substitute for Phase 1C's denial
  # suite. Warning-only for now: ZAP's alert set needs one or two real runs
  # against this app before an alert-filter rules file can be trusted as a
  # hard merge blocker, so `continue-on-error: true` and no branch-protection
  # requirement yet (see docs/conventions/ci.md).
  owasp-baseline:
    needs: changes-and-static
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-live-gates')
    runs-on: ubuntu-22.04
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install O04-equivalent native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config \
            tesseract-ocr tesseract-ocr-vie shellcheck apparmor
      # See phase1b-o04-release-gate's own comment: the convert worker's
      # nested sandbox needs the same AppArmor profile loaded to boot.
      - name: Load the convert sandbox AppArmor profile
        run: sudo apparmor_parser -r -W deploy/poc/apparmor-markhand-convert
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.88.0
      - name: Boot POC Compose stack
        run: |
          cp deploy/.env.example deploy/.env
          deploy/scripts/poc-up.sh
          deploy/scripts/poc-health.sh
      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: "http://127.0.0.1:8788"
          # Non-blocking: the action's own exit status stays green even if ZAP
          # finds alerts. `continue-on-error` above is the second, job-level
          # safety net so the workflow overall never fails from this gate.
          fail_action: false
          # No automated GitHub issue filing while the gate is unconditionally
          # warning-only; the report artifact below is the evidence trail.
          allow_issue_writing: false
          artifact_name: owasp-baseline-${{ github.sha }}
      - name: Dump POC logs on failure
        if: failure()
        run: docker compose -f deploy/compose.poc.yml logs --tail=200 || true
      - name: Tear down POC stack
        if: always()
        run: docker compose -f deploy/compose.poc.yml down -v

  corpus:
    needs: changes-and-static
    if: needs.changes-and-static.outputs.corpus == 'true'
    # generator-environment.lock.json pins fonts-dejavu-core 2.37-8 from Ubuntu 24.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bench/markhand_web/requirements-corpus.txt
      - run: python3 -m pip install -r bench/markhand_web/requirements-corpus.txt
      - run: make check-corpus

  frontend:
    needs: changes-and-static
    if: needs.changes-and-static.outputs.frontend == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: make check-desktop

  web:
    needs: changes-and-static
    if: needs.changes-and-static.outputs.web == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: make check-web

  web-e2e:
    needs: changes-and-static
    if: needs.changes-and-static.outputs.web == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The runner has no pre-installed browser (unlike the dev environment,
      # where playwright.config.ts points at a fixed path); install just
      # Chromium + its OS deps here so Playwright resolves the browser itself.
      - run: pnpm --dir web exec playwright install --with-deps chromium
      # Playwright starts its own mock-mode vite dev server (see
      # playwright.config.ts `webServer`); no backend stack required.
      - run: pnpm --dir web e2e

  dev-stack:
    needs: changes-and-static
    if: needs.changes-and-static.outputs.dev_stack == 'true'
    runs-on: ubuntu-22.04
    env:
      MARKHAND_SPIKE_REPORT: /tmp/markhand-spike-environment.json
      COMPOSE_PROFILES: mock
      DEV_STACK_MODE: ${{ needs.changes-and-static.outputs.dev_stack_mode }}
      DEV_STACK_RUST_SERVER: ${{ needs.changes-and-static.outputs.rust == 'true' && (needs.changes-and-static.outputs.rust_crates == 'full' || contains(needs.changes-and-static.outputs.rust_crates, 'server')) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.88.0
      # dev-stack-ci.sh's full tier always builds+runs fileconv-server itself
      # now (web-e2e-real.sh, real-deployment half of P2-15), not only when
      # dev-server-smoke does — so this no longer needs to exclude runs where
      # the Rust job also ran; caching the build is worth it either way.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        if: needs.changes-and-static.outputs.dev_stack_mode == 'full'
      # Node/pnpm only for the full tier's web-e2e-real.sh step (SPA build +
      # Playwright); the lite tier never reaches it, so skip the setup cost
      # there.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: needs.changes-and-static.outputs.dev_stack_mode == 'full'
        with:
          version: 10.33.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: needs.changes-and-static.outputs.dev_stack_mode == 'full'
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install web dependencies
        if: needs.changes-and-static.outputs.dev_stack_mode == 'full'
        run: pnpm install --frozen-lockfile
      # See web-e2e job's own comment: no pre-installed browser on this
      # runner, so resolve Chromium via Playwright itself.
      - name: Install Playwright Chromium
        if: needs.changes-and-static.outputs.dev_stack_mode == 'full'
        run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Validate and smoke-test local services
        run: bash deploy/scripts/dev-stack-ci.sh

  linux-bundle:
    needs: changes-and-static
    if: needs.changes-and-static.outputs.bundle == 'true'
    runs-on: ubuntu-22.04
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install native bundle dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf file tesseract-ocr
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.88.0
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: python3 scripts/prepare-desktop-runtime.py --platform linux
      - run: make bundle-linux
